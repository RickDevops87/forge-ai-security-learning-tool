[project]
name = "ai-security-learning-tool"
version = "0.1.0"
description = "Fun, approachable AI security learning tool for ordinary users"
requires-python = ">=3.10"
dependencies = [
    "textual",
    "httpx",
    "pydantic",
    "pyyaml",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
local = ["ollama"]

[project.scripts]
ai-security-lab = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
